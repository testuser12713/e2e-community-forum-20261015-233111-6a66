# Alembic configuration for the community forum API.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
# The database URL is supplied at runtime from DATABASE_URL (see env.py); no
# value — and therefore no secret — is stored here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
