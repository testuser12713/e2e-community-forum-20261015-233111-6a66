[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "community-forum-api"
version = "0.1.0"
description = "Community forum API (FastAPI, SQLAlchemy 2.0, Alembic, PostgreSQL)"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
